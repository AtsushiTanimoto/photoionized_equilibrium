[project]
name = "photoionized-equilibrium"
version = "0.1.0"
description = "光電離プラズマの電離平衡 + 熱平衡のモンテカルロ計算 (MONACO 移植の試作)"
authors = [
    { name = "Atsushi Tanimoto", email = "atsushi.tanimoto@ogu.ac.jp" }
]
requires-python = ">=3.15"
dependencies = [
    "astropy>=8.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[tool.uv]
# パッケージとしてビルドしない (コードは source/ にフラットに置き、source/ 内から uv run python <script>.py で実行する)
package = false
